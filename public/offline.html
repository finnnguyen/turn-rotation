<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163c35" />
    <title>Offline · Turn Rotation</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f1e8; color: #182a27; font-family: system-ui, sans-serif; }
      main { width: min(34rem, calc(100% - 2rem)); border: 1px solid #d9ddd9; border-radius: 1.5rem; background: white; padding: 2rem; box-shadow: 0 1rem 3rem rgba(24, 42, 39, 0.08); }
      h1 { margin-top: 0; }
      dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: 1.5rem 0; }
      dl div { border-radius: .75rem; background: #f5f1e8; padding: .75rem; }
      dt { color: #5f6f6b; font-size: .75rem; }
      dd { margin: .25rem 0 0; font-size: 1.25rem; font-weight: 700; }
      #snapshot[hidden] { display: none; }
      button { min-height: 3rem; border: 0; border-radius: 0.75rem; background: #163c35; color: white; padding: 0 1.25rem; font-weight: 700; }
      button:focus-visible { outline: 3px solid #a95f38; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Turn Rotation is offline</h1>
      <p>Changes are blocked until your connection returns. This read-only snapshot contains counts only—no customer or employee names.</p>
      <section id="snapshot" hidden aria-labelledby="snapshot-title">
        <h2 id="snapshot-title">Last synchronized dashboard</h2>
        <p id="synced-at"></p>
        <dl>
          <div><dt>Master rotation</dt><dd id="master-count">0</dd></div>
          <div><dt>Haircut rotation</dt><dd id="haircut-count">0</dd></div>
          <div><dt>Waiting customers</dt><dd id="waiting-count">0</dd></div>
          <div><dt>Available / serving</dt><dd id="staff-count">0 / 0</dd></div>
        </dl>
      </section>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      try {
        const value = JSON.parse(localStorage.getItem("turn-rotation-dashboard-snapshot-v1"));
        if (value && value.synchronizedAt) {
          document.getElementById("snapshot").hidden = false;
          document.getElementById("synced-at").textContent = `Saved ${new Date(value.synchronizedAt).toLocaleString()} · State version ${value.stateVersion}`;
          document.getElementById("master-count").textContent = String(value.masterCount ?? 0);
          document.getElementById("haircut-count").textContent = String(value.haircutCount ?? 0);
          document.getElementById("waiting-count").textContent = String(value.waitingCount ?? 0);
          document.getElementById("staff-count").textContent = `${value.availableCount ?? 0} / ${value.servingCount ?? 0}`;
        }
      } catch {}
    </script>
  </body>
</html>
